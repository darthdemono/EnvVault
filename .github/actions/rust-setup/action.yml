name: Rust workspace setup
description: >-
  System packages, the Windows OpenSSL toolchain, Rust, the cargo cache and the
  built frontend that tauri-build needs. Shared by the CI `test` and `lint` jobs
  so the long Windows block lives in one place.

inputs:
  cache-key:
    description: Cache key suffix. Test and lint build different artefacts, so they must not share one.
    required: true
  components:
    description: Extra rust components.
    default: clippy, rustfmt

runs:
  using: composite
  steps:
    # rusqlite's `sqlcipher` feature links against the system SQLCipher, and the
    # Tauri crate needs the WebKitGTK stack even for `cargo check`. mold is here
    # because `.cargo/config.toml` passes `-fuse-ld=mold` for this target. Windows
    # needs none of this: it vendors SQLCipher and OpenSSL (see
    # vault-core/Cargo.toml) and WebView2 ships with the runner image.
    - name: Install system dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libsqlcipher-dev \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          patchelf \
          mold

    # Windows has no system SQLCipher, so vault-core's cfg(windows) dependency
    # vendors SQLCipher *and* OpenSSL, and building OpenSSL from source needs a
    # real Perl and NASM. OpenSSL's Configure is a Perl program that needs a full
    # Perl (Locale::Maketext::Simple among others).
    #
    # windows-latest ships Strawberry Perl, which has those modules. It also ships
    # Git for Windows, whose bundled MSYS Perl does NOT, and the build steps run
    # under `shell: bash`, where Git's `/usr/bin/perl` comes first on PATH. So
    # `perl` resolves, `perl --version` prints happily, and the build dies a
    # thousand lines later with:
    #
    #   Can't locate Locale/Maketext/Simple.pm in @INC
    #
    # Putting Strawberry ahead of it on PATH is the whole fix. `C:\Strawberry\c\bin`
    # is included because Configure also wants the toolchain that ships with it.
    - name: Put Strawberry Perl ahead of Git's Perl on PATH
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if (-not (Test-Path 'C:\Strawberry\perl\bin\perl.exe')) {
          choco install strawberryperl -y --no-progress
        }
        'C:\Strawberry\c\bin', 'C:\Strawberry\perl\site\bin', 'C:\Strawberry\perl\bin' |
          ForEach-Object { Add-Content -Path $env:GITHUB_PATH -Value $_ }
        # PATH order alone is not a guarantee. `shell: bash` is Git bash, whose
        # msys runtime injects its own /usr/bin when it converts the Windows PATH,
        # so Git's perl can still win however GITHUB_PATH is ordered.
        # openssl-src reads OPENSSL_SRC_PERL before falling back to PATH
        # (openssl-src/src/lib.rs), so name the interpreter outright and the race
        # stops mattering.
        Add-Content -Path $env:GITHUB_ENV -Value 'OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe'

    # Assert the toolchain can actually do the job, not merely that the binaries
    # exist. `command -v perl` passed for the whole life of an earlier version of
    # this check while the Perl it found was the one that cannot build OpenSSL.
    - name: Verify the vendored-OpenSSL toolchain
      if: runner.os == 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        # Check the interpreter openssl-src will actually run, not whichever perl
        # this shell resolves: they differ once OPENSSL_SRC_PERL is set above.
        perl_bin="${OPENSSL_SRC_PERL:-perl}"
        missing=""
        command -v "$perl_bin" >/dev/null || missing="$missing perl"
        command -v nasm >/dev/null || missing="$missing nasm"
        if [ -n "$missing" ]; then
          echo "::error::openssl-src needs$missing to vendor OpenSSL for Windows."
          exit 1
        fi
        echo "perl: $(command -v "$perl_bin")"
        "$perl_bin" --version | sed -n '2p'
        nasm -v
        if ! "$perl_bin" -MLocale::Maketext::Simple -e 1 2>/dev/null; then
          echo "::error::$perl_bin cannot load Locale::Maketext::Simple, so OpenSSL's Configure will fail. This is usually Git for Windows' MSYS perl shadowing Strawberry Perl."
          exit 1
        fi
        echo "Locale::Maketext::Simple loads: OpenSSL's Configure will run."

    - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      with:
        components: ${{ inputs.components }}

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        key: ${{ inputs.cache-key }}

    # `cargo check`/`cargo test` reach the Tauri app crate, whose build script
    # fails outright when `frontendDist` ("../dist") is missing, and dist/ is
    # gitignored. Build it here so the Rust jobs have something to point at.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: npm

    - name: Build the frontend (tauri-build needs ../dist to exist)
      shell: bash
      run: |
        npm ci
        npx vite build
