name: Build & Release

# Compilation and packaging. Deliberately separate from ci.yml: that one is the
# fast gate every push pays for (check + test + typecheck, ~3 min), this one is
# the expensive one (a full Tauri bundle is 15+ min per platform) and only runs
# when there is something to ship.
#
# A release happens when, and only when, the version number goes up.
#
# The trigger is a push to `main`, but the decision is not "was there a push" —
# it is "does a tag named v<version> already exist?". A README fix leaves the
# version alone, `v0.6.0` is still there from last time, and the run stops after
# the ~10-second `meta` job without building or publishing anything. Bump the
# version with `npm run version <x.y.z>` and the same push builds and releases,
# once. Push again without touching the version and it stops again.
#
# That tag check is the idempotency guard, and it is deliberately the only one:
# re-running the workflow, pushing an empty commit, or a merge that touches
# nothing all resolve to "the tag exists", which is the same answer whether it
# is asked once or ten times. Nothing here compares timestamps or diffs paths,
# because a path filter gets this wrong in exactly the case that matters — a
# commit that bumps the version AND edits the README would be skipped by
# `paths-ignore: ['**.md']`.
#
# Pushing a `v*` tag by hand still works and still publishes, for re-releasing
# an older commit.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release (off = build artifacts only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Never cancel a run that might be releasing: a partially-uploaded release —
  # image pushed, GitHub Release missing — is worse than a slow one.
  #
  # That now covers `main` as well as tags. Before this workflow triggered on
  # branches, a main push never reached it and cancelling was free; now the
  # release path runs from main, and a second push landing mid-upload would
  # kill it. Pushes that change nothing still queue, but they stop at the
  # ~10-second `meta` job, so the queue costs almost nothing.
  group: build-${{ github.ref }}
  cancel-in-progress: >-
    ${{ github.ref != 'refs/heads/main'
        && !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Version is stated in six files. This job is the only thing that stops them
  # from drifting, because nothing else in the build reads more than one of them
  # and a mismatch is invisible until a user downloads `EnvVault_0.6.0.AppImage`
  # from a release labelled 0.7.0. `npm run version <x.y.z>` writes all six;
  # `npm run version:check` is the same comparison this job performs, so drift
  # is catchable before pushing.
  #
  # It also decides whether the rest of the workflow runs at all. Everything
  # below it is expensive — a Tauri bundle is 15+ minutes per platform — so the
  # gate has to be here, in a job that finishes in seconds.
  # ---------------------------------------------------------------------------
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      build: ${{ steps.v.outputs.build }}
    steps:
      # fetch-depth 0 brings the tags with it. `git tag --list` below is the
      # whole release gate, and on a shallow clone it would find nothing and
      # re-release every push.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and cross-check the version
        id: v
        shell: bash
        run: |
          set -euo pipefail

          # tauri.conf.json is the source of truth: Tauri stamps this string
          # into every bundle filename and into the Windows installer metadata.
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          echo "tauri.conf.json: ${VERSION}"

          fail=0
          check() {  # check <file> <actual>
            if [ "$2" != "$VERSION" ]; then
              echo "::error file=$1::version is '$2', tauri.conf.json says '$VERSION'"
              fail=1
            else
              echo "  ok  $1 = $2"
            fi
          }

          check package.json          "$(jq -r .version package.json)"
          for c in src-tauri vault-core envv-server envv-cli; do
            check "$c/Cargo.toml" \
              "$(sed -n 's/^version *= *"\(.*\)"/\1/p' "$c/Cargo.toml" | head -n1)"
          done

          [ "$fail" -eq 0 ] || exit 1
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          # ---- Does anything downstream run? ---------------------------------
          #
          # `publish` gates the release job. `build` gates the two expensive
          # build jobs, and is a separate output so that a manual dispatch can
          # produce installers to test without publishing them.
          publish=false
          build=false

          case "${GITHUB_REF}" in
            refs/tags/v*)
              # A hand-pushed tag. It is a seventh copy of the number, so it
              # gets checked like the rest.
              TAG="${GITHUB_REF#refs/tags/v}"
              if [ "$TAG" != "$VERSION" ]; then
                echo "::error::tag v${TAG} does not match tauri.conf.json ${VERSION}"
                exit 1
              fi
              publish=true
              build=true
              ;;

            refs/heads/main)
              # THE RELEASE GATE.
              #
              # `git tag --list` prints the name if it exists and nothing if it
              # does not — it never fails, so `set -e` cannot abort here. An
              # existing tag means this version has already been released and
              # this push changed something else: documentation, a test, a
              # refactor. Stop.
              if [ -n "$(git tag --list "v${VERSION}")" ]; then
                echo "v${VERSION} is already tagged — nothing to release."
                echo "Bump with 'npm run version <x.y.z>' to cut a new one."
                {
                  echo "### No release"
                  echo ""
                  echo "\`v${VERSION}\` already exists. This push did not change the version."
                } >> "$GITHUB_STEP_SUMMARY"
              else
                echo "v${VERSION} has no tag yet — releasing."
                {
                  echo "### Releasing ${VERSION}"
                  echo ""
                  echo "No \`v${VERSION}\` tag existed; it will be created on \`${GITHUB_SHA}\`."
                } >> "$GITHUB_STEP_SUMMARY"
                publish=true
                build=true
              fi
              ;;

            *)
              # workflow_dispatch, or a push to some other branch. Build so the
              # artefacts can be downloaded and tested; publish only if asked.
              publish="${{ inputs.publish || false }}"
              build=true
              ;;
          esac

          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          echo "build=${build}"     >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # The desktop app. `tauri build` runs `npm run build:frontend` itself via
  # beforeBuildCommand, so the frontend is compiled inside this job.
  # ---------------------------------------------------------------------------
  desktop:
    name: Desktop (${{ matrix.label }})
    needs: meta
    # Skipped on any push that did not move the version. ci.yml already ran
    # check, clippy, the Rust tests and the frontend suite on this commit; what
    # is skipped here is only the packaging, which nothing consumes unless a
    # release is being cut.
    if: needs.meta.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      # A Windows-only break must not hide behind a green Linux run.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x86_64
          - os: windows-latest
            label: windows-x86_64
    steps:
      - uses: actions/checkout@v4

      # ubuntu-22.04, not -latest: the AppImage and .deb link against the
      # runner's glibc, and a bundle built on 24.04 refuses to start on
      # anything older. Building on the oldest supported base is the only way
      # a "portable" Linux artefact is actually portable.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            mold
          # `.cargo/config.toml` passes -fuse-ld=mold for this target. ci.yml
          # gets away without it because its RUSTFLAGS env var overrides the
          # config file entirely; this job sets no RUSTFLAGS, so the flag
          # applies and the link fails without the linker installed.

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.label }}

      - run: npm ci

      - name: Build bundles
        shell: bash
        env:
          # linuxdeploy shells out to `strip`; NO_STRIP works around versions
          # too old for .relr.dyn sections. EXTRACT_AND_RUN is required because
          # GitHub runners have no FUSE for the AppImage tooling to mount with.
          NO_STRIP: "1"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          # vault-core/bundled compiles SQLCipher and OpenSSL in. Without it an
          # AppImage built here links the runner's libsqlcipher0 and dies on any
          # distro shipping a different soname — the exact failure a portable
          # bundle exists to prevent.
          npx tauri build --features vault-core/bundled

      - name: Collect bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          # Globs, not literal filenames: Tauri derives each name from the
          # version and per-format arch conventions (_amd64.deb vs .x86_64.rpm).
          shopt -s nullglob
          for f in target/release/bundle/appimage/*.AppImage \
                   target/release/bundle/deb/*.deb \
                   target/release/bundle/rpm/*.rpm \
                   target/release/bundle/nsis/*-setup.exe \
                   target/release/bundle/msi/*.msi; do
            cp "$f" staging/
          done
          ls -lh staging/
          # An empty staging dir means the bundle step "succeeded" while
          # producing nothing shippable. Fail here rather than at release time.
          [ -n "$(ls -A staging)" ] || { echo "::error::no bundles produced"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}
          path: staging/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # `envv` and `envv-server` — the headless half. Shipped as their own archive
  # because the server runs on machines that will never have a GUI toolkit, and
  # the CLI is what agents and CI call.
  # ---------------------------------------------------------------------------
  headless:
    name: CLI + server (${{ matrix.label }})
    needs: meta
    if: needs.meta.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x86_64
            archive: tar.gz
          - os: windows-latest
            label: windows-x86_64
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - name: Install mold
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mold

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: headless-${{ matrix.label }}

      # --locked: the workspace Cargo.lock is committed on purpose (rand 0.10
      # and rusqlite 0.39 have both broken this build via semver-compatible
      # updates). A release must compile the pinned graph, not today's.
      # Built one package at a time so a failure names the crate.
      - name: Build envv
        run: cargo build --release --locked -p envv-cli --features vault-core/bundled

      - name: Build envv-server
        run: cargo build --release --locked -p envv-server --features vault-core/bundled

      - name: Smoke test the binaries
        shell: bash
        run: |
          set -euo pipefail
          # `[ … ] && EXE=…` would make this line the script's exit status
          # under `set -e`, so a Linux run would abort here reporting nothing.
          EXE=""
          if [ "${RUNNER_OS}" = "Windows" ]; then EXE=".exe"; fi
          "target/release/envv${EXE}" --version
          "target/release/envv-server${EXE}" --version
          # `describe` is the CLI's machine-readable contract, generated from the
          # clap tree. If it stops emitting valid JSON, every agent integration
          # breaks silently — so a release must not ship a binary that fails here.
          # The version inside it comes from CARGO_PKG_VERSION, which is a sixth
          # copy of the number the meta job checked; assert it agrees.
          "target/release/envv${EXE}" describe \
            | jq -e --arg v "${{ needs.meta.outputs.version }}" \
                 '.version == $v and (.command.subcommands | length) > 0' > /dev/null

      - name: Stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          EXE=""
          if [ "${RUNNER_OS}" = "Windows" ]; then EXE=".exe"; fi
          cp "target/release/envv${EXE}" "target/release/envv-server${EXE}" staging/
          cp README.md staging/
          ls -lh staging/

      - uses: actions/upload-artifact@v4
        with:
          name: headless-${{ matrix.label }}
          path: staging/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # The server image. `envv-server` is the one component people run unattended
  # and on a machine that is not their desktop, so it is the one that wants a
  # pull-able artefact rather than a tarball.
  #
  # Built here rather than in ci.yml because a full Rust image build is 10+
  # minutes and ci.yml already compiles and tests the same code natively. What
  # this adds over that is the packaging, and packaging only matters when
  # something is being shipped.
  # ---------------------------------------------------------------------------
  docker:
    name: Server image (GHCR)
    needs: meta
    if: needs.meta.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Logging in only when the image will actually be pushed keeps the
      # dispatch-without-publish path from needing a credential at all.
      - name: Log in to GHCR
        if: needs.meta.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name and tags
        id: img
        shell: bash
        run: |
          set -euo pipefail
          # `github.repository` is `owner/name`, and GHCR requires it lowercased:
          # a capital letter in either half makes `docker push` fail with an
          # "invalid reference format" that names nothing useful.
          NAME="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/envv-server"
          VERSION="${{ needs.meta.outputs.version }}"
          MINOR="${VERSION%.*}"
          echo "name=${NAME}"   >> "$GITHUB_OUTPUT"
          echo "minor=${MINOR}" >> "$GITHUB_OUTPUT"
          echo "image: ${NAME}:${VERSION} (also :${MINOR}, :latest)"

      # Three tags on a release: the exact version, the minor line, and
      # `latest`. `0.6` moving to `0.6.1` is what lets a compose file pin a
      # patch stream; `latest` is for people who have not decided yet.
      #
      # No `:main` tag. An image named after a branch is one `docker pull`
      # away from someone running unreleased code against a real vault.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ needs.meta.outputs.publish == 'true' }}
          # `load: true` on every path, including the pushing one. This is a
          # single-platform build, so buildx can write to the local daemon and
          # the registry from the same invocation — and that is what lets the
          # smoke test below run against the exact image that was pushed rather
          # than skipping on the only path where it matters.
          load: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ needs.meta.outputs.version }}
            ${{ steps.img.outputs.name }}:${{ steps.img.outputs.minor }}
            ${{ steps.img.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image has to actually start. A Dockerfile that builds and then dies
      # on ENTRYPOINT is the failure a build-only job cannot see, and for a
      # server image it is the only failure that matters.
      #
      # `--entrypoint` overrides the ENTRYPOINT's `--host/--db-path/--salt-path`
      # so this does not try to open a vault in a container with no volume.
      - name: Smoke test the image
        run: |
          docker run --rm --entrypoint envv-server \
            "${{ steps.img.outputs.name }}:${{ needs.meta.outputs.version }}" --version

  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    needs: [meta, desktop, headless, docker]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # cosign keyless (Sigstore OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Assemble release assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.meta.outputs.version }}"
          mkdir -p release-assets

          # Desktop bundles ship as-is: a .deb renamed is a .deb that apt still
          # installs, but the installer filename is what users read, and Tauri's
          # own naming already carries version and arch.
          cp artifacts/desktop-*/* release-assets/

          # Headless binaries get archived per platform, with a flat layout so
          # `tar xzf … && ./envv` works with no path juggling.
          ( cd artifacts/headless-linux-x86_64 && chmod +x envv envv-server \
            && tar czf "$GITHUB_WORKSPACE/release-assets/envv-${VERSION}-linux-x86_64.tar.gz" . )
          ( cd artifacts/headless-windows-x86_64 \
            && zip -qr "$GITHUB_WORKSPACE/release-assets/envv-${VERSION}-windows-x86_64.zip" . )

          # `--` so an asset whose name begins with a dash is read as a file
          # rather than an option, and the sums file keeps plain names.
          ( cd release-assets && sha256sum -- * > SHA256SUMS )
          ls -lh release-assets/

      - name: Changelog since the previous tag
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          # Exclude the tag being released by NAME, not by ${GITHUB_REF_NAME}.
          # On the branch-push path GITHUB_REF_NAME is "main", the exclusion
          # matches nothing, and `git describe` happily returns the tag we are
          # about to create — producing an empty changelog on every release.
          PREV=$(git describe --tags --abbrev=0 \
                   --exclude="v${{ needs.meta.outputs.version }}" 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..HEAD"; echo "range: ${RANGE}"
          else
            RANGE="HEAD"; echo "no previous tag; using full history"
          fi
          {
            echo "commits<<ENDOFCHANGELOG"
            git log --no-merges --pretty=format:"- %s (%an)" "$RANGE"
            echo ""
            echo "ENDOFCHANGELOG"
          } >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v3

      - name: Sign every asset (cosign keyless)
        shell: bash
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          # Keyless Sigstore signing off the job's OIDC token — no secret to
          # rotate, and the certificate binds each signature to this workflow
          # identity. For a secrets manager, "this binary came from that repo's
          # CI" is the claim that matters; a self-signed Authenticode cert makes
          # no such claim (and still trips SmartScreen), so it is not used here.
          shopt -s nullglob
          # The glob is expanded once, so the .sig/.pem files written inside
          # the loop are not themselves picked up as inputs.
          for f in release-assets/*; do
            echo "signing $f"
            cosign sign-blob --output-signature "${f}.sig" \
                             --output-certificate "${f}.pem" "$f"
          done
          ls -lh release-assets/

      # `commit:` is what makes the branch-push path work: when no `v<version>`
      # tag exists, this action creates it pointing at the commit that was
      # built, rather than requiring a tag to have been pushed first. On the
      # hand-pushed-tag path the tag already exists at that same commit and this
      # is a no-op.
      #
      # `allowUpdates: true` keeps a re-run from failing outright, but note what
      # it means: re-running a release job replaces the assets on an existing
      # release. That is the desired behaviour for a retried upload and the
      # wrong one for a second release of the same number — which is precisely
      # what the tag check in `meta` prevents from ever reaching this job.
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ needs.meta.outputs.version }}
          commit: ${{ github.sha }}
          name: EnvVault ${{ needs.meta.outputs.version }}
          artifacts: "release-assets/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
          draft: false
          prerelease: false
          body: |
            # EnvVault ${{ needs.meta.outputs.version }}

            ## Desktop

            | File | Platform |
            | ---- | -------- |
            | `*.AppImage` | Linux, any distro — SQLCipher and OpenSSL are compiled in |
            | `*.deb` | Debian / Ubuntu |
            | `*.rpm` | Fedora / RHEL |
            | `*-setup.exe` | Windows (NSIS; WebView2 is fetched by the installer if absent) |

            Linux bundles are built on Ubuntu 22.04, so they run on that glibc and newer.

            ## CLI and server

            | File | Contains |
            | ---- | -------- |
            | `envv-${{ needs.meta.outputs.version }}-linux-x86_64.tar.gz` | `envv`, `envv-server` |
            | `envv-${{ needs.meta.outputs.version }}-windows-x86_64.zip` | `envv.exe`, `envv-server.exe` |

            `envv describe` prints the full command tree, exit codes and redaction
            rules as JSON — read that rather than guessing from error messages.

            ## Verifying a download

            Checksums are in `SHA256SUMS`. Every asset also carries a keyless
            Sigstore signature (`.sig`) and certificate (`.pem`):

            ```
            cosign verify-blob \
              --certificate <asset>.pem \
              --signature   <asset>.sig \
              --certificate-identity-regexp 'https://github.com/${{ github.repository }}/.*' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              <asset>
            ```

            ## Changes

            ${{ steps.changelog.outputs.commits }}
