name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Keep CI output focused on errors we can act on.
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should still report the other, or a Windows-only
      # break hides behind a green Linux run and vice versa.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # rusqlite's `sqlcipher` feature links against the system SQLCipher, and
      # the Tauri crate needs the WebKitGTK stack even for `cargo check`.
      # Windows needs none of this: it vendors SQLCipher and OpenSSL (see
      # vault-core/Cargo.toml) and WebView2 ships with the runner image.
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsqlcipher-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # vault-core holds the crypto, storage and RBAC logic; envv-server holds the
      # session and LAN-hosting logic. Regressions in either are security bugs
      # rather than cosmetic ones.
      - name: Test
        run: cargo test --workspace --verbose

      - name: Check the whole workspace
        run: cargo check --workspace --all-targets

      # The portable build path — SQLCipher and OpenSSL compiled in — is what
      # release artefacts use, so it has to be exercised somewhere. Checking it
      # on Linux catches a broken feature union without paying for it on both.
      - name: Check the bundled (distro-independent) build
        if: runner.os == 'Linux'
        run: cargo check -p vault-core --features bundled

  frontend:
    name: Frontend (typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: UI tests
        run: npm test

      - name: Build
        run: npx vite build
