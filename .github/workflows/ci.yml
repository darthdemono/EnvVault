name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing here writes to the repo. Build & Release asks for
# more, in the one job that needs it.
permissions:
  contents: read

concurrency:
  # A superseded push has nothing to tell us; cancel it and free the runner.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep CI output focused on errors we can act on.
  # Also load-bearing beyond warnings: setting RUSTFLAGS as an env var makes
  # cargo ignore the rustflags in `.cargo/config.toml`, which pass
  # `-fuse-ld=mold` for the Linux target. Drop this line and every Linux job
  # here fails to link, because the runner has no mold. Build & Release sets no
  # RUSTFLAGS and therefore installs mold instead.
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should still report the other, or a Windows-only
      # break hides behind a green Linux run and vice versa.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # rusqlite's `sqlcipher` feature links against the system SQLCipher, and
      # the Tauri crate needs the WebKitGTK stack even for `cargo check`.
      # Windows needs none of this: it vendors SQLCipher and OpenSSL (see
      # vault-core/Cargo.toml) and WebView2 ships with the runner image.
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsqlcipher-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # `--locked` below refuses to build if a Cargo.toml edit was committed
      # without the matching Cargo.lock. Saying so here beats a resolver error
      # buried in the test job's output.
      - name: Cargo.lock is up to date
        run: cargo metadata --locked --format-version 1 > /dev/null

      # vault-core holds the crypto, storage and RBAC logic; envv-server holds the
      # session and LAN-hosting logic. Regressions in either are security bugs
      # rather than cosmetic ones.
      - name: Test
        run: cargo test --workspace --locked --verbose

      - name: Check the whole workspace
        run: cargo check --workspace --locked --all-targets

      # The portable build path — SQLCipher and OpenSSL compiled in — is what
      # release artefacts use, so it has to be exercised somewhere. Checking it
      # on Linux catches a broken feature union without paying for it on both.
      - name: Check the bundled (distro-independent) build
        if: runner.os == 'Linux'
        run: cargo check -p vault-core --locked --features bundled

  frontend:
    name: Frontend (typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: UI tests
        run: npm test

      - name: Build
        run: npx vite build
