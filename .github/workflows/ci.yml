name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # R02: Build & Release calls this workflow as its first job, so a release can
  # only start from a SHA whose CI passed *in the same run*. `gate` marks that
  # call: it gets its own concurrency group and is never cancelled.
  workflow_call:
    inputs:
      gate:
        description: Called by Build & Release as a release gate
        type: boolean
        default: false

# Least privilege: nothing here writes to the repo. Build & Release asks for
# more, in the one job that needs it.
permissions:
  contents: read

concurrency:
  # A superseded push has nothing to tell us; cancel it and free the runner. The
  # release gate is the exception: its group differs from the push-triggered run
  # on the same ref (or the two would cancel each other), and cancelling it would
  # make a release depend on which push landed last.
  group: ci-${{ github.ref }}-${{ inputs.gate && 'gate' || 'push' }}
  cancel-in-progress: ${{ !inputs.gate }}

env:
  CARGO_TERM_COLOR: always

# Warnings are denied via `[workspace.lints.rust]` in the root Cargo.toml, not
# via RUSTFLAGS here. RUSTFLAGS would apply to dependencies too, so a warning in
# a platform-specific crate like `windows-sys` or `openssl-src` would fail this
# job with nothing in the repository to fix. It also means `cargo check` locally
# enforces exactly what CI enforces.
#
# Consequence: with no RUSTFLAGS set, `.cargo/config.toml` is no longer
# overridden, so its `-fuse-ld=mold` applies on Linux and mold has to be
# installed below — the same thing Build & Release already does.

jobs:
  # `test` and `lint` used to be one `rust` job whose steps ran back to back, so
  # Windows paid test (18 min) + `cargo check --all-targets` (10 min) + clippy in
  # sequence: 32 min in the last green run. They are separate jobs now and run
  # side by side. `cargo check --all-targets` is gone: clippy `--all-targets`
  # compiles the same code with the same flags and reports strictly more.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should still report the other, or a Windows-only
      # break hides behind a green Linux run and vice versa.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: test
          components: ""

      # `--locked` below refuses to build if a Cargo.toml edit was committed
      # without the matching Cargo.lock. Saying so here beats a resolver error
      # buried in the test job's output.
      - name: Cargo.lock is up to date
        run: cargo metadata --locked --format-version 1

      # vault-core holds the crypto, storage and RBAC logic; unv-server holds the
      # session and LAN-hosting logic. Regressions in either are security bugs
      # rather than cosmetic ones.
      - name: Test
        run: cargo test --workspace --locked --verbose

  lint:
    name: Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: lint
          components: clippy, rustfmt

      # Prebuilt binary, pinned to a version: `cargo install` compiled it from
      # source on every run. 0.18.5 cannot parse the advisory database's CVSS 4.0
      # scores ("unsupported CVSS version"), hence the floor.
      - name: Install cargo-deny
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-deny@0.20.2

      - name: Dependency policy (cargo-deny)
        if: runner.os == 'Linux'
        run: cargo deny check advisories bans licenses sources

      # Formatting is platform-independent, so checking it on both runners would
      # pay twice for the same answer. `--check` prints a diff and exits
      # non-zero; it never rewrites the tree.
      - name: Formatting (rustfmt)
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      # Clippy runs on both, because the lints that matter here are behind
      # `cfg`: vault-core vendors SQLCipher and OpenSSL only on Windows, and
      # unv-cli's process-spawning code takes a different branch there. A
      # Linux-only clippy would never see either.
      #
      # No `-D warnings` on the command line: the levels live in the root
      # Cargo.toml under `[workspace.lints.clippy]`, so `cargo clippy` locally
      # enforces exactly what this line does. Passing the flag here as well
      # would apply it to dependencies too.
      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets

      # The portable build path (SQLCipher and OpenSSL compiled in) is what
      # release artefacts use, so it has to be exercised somewhere. Checking it
      # on Linux catches a broken feature union without paying for it on both.
      - name: Check the bundled (distro-independent) build
        if: runner.os == 'Linux'
        run: cargo check -p vault-core --locked --features bundled

  frontend:
    name: Frontend (typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      # First, because it is the cheapest and the one whose failure invalidates
      # a release rather than a commit. The version is stated in six files and
      # nothing else in this workflow reads more than one of them.
      - name: Version numbers agree
        run: npm run version:check

      # `--check` only reports. Reformatting in CI and committing the result
      # would mean the tree on disk never matches the tree that was reviewed.
      - name: Formatting (Prettier)
        run: npm run format:check

      # `eslint-suppressions.json` records the 237 pre-existing violations this
      # config found when it was introduced, so this step passes today and
      # fails on anything NEW. Fix some of the backlog and run
      # `npx eslint --prune-suppressions` to shrink the file — never regenerate
      # it wholesale with `--suppress-all`, which would silently absorb real
      # regressions along with the old debt.
      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: UI tests
        run: npm test

      - name: Build
        run: npx vite build

      - name: VS Code extension builds and packages
        run: |
          cd vscode-extension
          npm ci
          npm run package
