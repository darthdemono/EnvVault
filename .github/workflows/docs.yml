name: Docs

# Publishes the product site and the documentation to GitHub Pages:
#
#   /                  — website/ (landing, download, quickstart, security, guides)
#   /docs/             — the mdBook guide
#   /reference/ts/     — Doxygen over src/ts/
#   /reference/rust/   — `cargo doc` over the four workspace crates
#   /catalogue/        — the signed provider catalogue
#   /book/ /ts/ /rust/ — redirect stubs to the new paths
#
# Two reference tools because there is no one tool. Doxygen has no Rust front end, and
# rustdoc has no TypeScript one. Rather than pick the language that gets docs,
# both halves are built with the tool that understands them and served side by
# side behind one landing page.
#
# Runs on `main` only. Docs describing a branch nobody merged are worse than no
# docs, and Pages has exactly one live deployment.

on:
  push:
    branches: [main]
  # Re-stamps the signed provider catalogue (Phase 31) so a stale one is visible
  # in `generated_at`, and refreshes the site's version and download table from
  # the latest release. Weekly (it was daily, a full Doxygen + rustdoc + mdBook
  # build every night for pages that change when the code does). Best-effort:
  # Actions schedules run late under load.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pages allows one in-flight deployment. Cancelling the superseded run is
  # correct here — unlike a release build, a half-finished docs run leaves
  # nothing behind.
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build the site and both references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # graphviz is not optional: Doxyfile sets HAVE_DOT=YES, and without `dot`
      # every include graph silently becomes a broken image rather than an
      # error.
      #
      # The WebKitGTK stack is here for `cargo doc`, which has to compile the
      # Tauri app crate's dependencies to document it.
      - name: Install doxygen, graphviz and the Linux build stack
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            doxygen \
            graphviz \
            libsqlcipher-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            mold

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: docs

      - run: npm ci

      - name: Install mdBook
        run: cargo install mdbook --locked --version 0.4.52

      # tauri-build fails outright when frontendDist ("../dist") is missing, and
      # `cargo doc` reaches the app crate.
      - name: Build the frontend (tauri-build needs ../dist to exist)
        run: npx vite build

      # Writes docs/ts/. `npm run docs` injects UNV_VERSION from
      # scripts/version.mjs so the rendered pages carry the real version rather
      # than a seventh hand-maintained copy of it.
      - name: Doxygen (TypeScript frontend)
        run: npm run docs

      # Surfaced in the run summary rather than failing the job. The
      # TypeScript-as-Javascript parse produces unavoidable noise on generics
      # and type-only exports; a docs job that is always red is a docs job
      # nobody reads. A sudden jump in the count is the signal worth noticing.
      - name: Doxygen warnings
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          log=docs/ts/doxygen-warnings.log
          if [ -s "$log" ]; then
            n=$(wc -l < "$log")
            {
              echo "### Doxygen: ${n} warnings"
              echo ""
              echo '```'
              head -40 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Doxygen: no warnings" >> "$GITHUB_STEP_SUMMARY"
          fi

      # --no-deps: document this workspace, not the 400 crates under it.
      - name: rustdoc (Rust crates)
        run: cargo doc --workspace --no-deps --locked

      # The product site (website/) is the Pages root; the guide and the two API
      # references live under it. build-site.mjs wipes ./site and stamps the
      # version and the download table from the latest *published release*, so
      # it must run first. It fails when the release cannot be read: a stale
      # version is worse than a failed deploy.
      - name: Assemble the site
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/build-site.mjs --out site
          mdbook build book --dest-dir ../site/docs
          mkdir -p site/reference
          cp -r docs/ts   site/reference/ts
          cp -r target/doc site/reference/rust

          # The warnings log is a build artefact, not documentation. It is in
          # the run summary above; leaving it in the published tree only invites
          # someone to read a stale copy.
          rm -f site/reference/ts/doxygen-warnings.log

          # Written as if/then, not `[ ... ] || exit`. See build.yml's binary
          # smoke test for the `set -e` trap this avoids.
          if [ ! -f site/reference/rust/vault_core/index.html ]; then
            echo "rustdoc output is missing vault_core/index.html" >&2
            exit 1
          fi
          du -sh site/reference/ts site/reference/rust

      # Phase 31. The private key is the CATALOGUE_SIGNING_KEY secret (64 hex
      # digits); its public half is pinned in vault-core/src/catalogue.rs. A fork
      # without the secret publishes no catalogue, and clients fall back to the
      # table compiled into the binary.
      - name: Sign the provider catalogue
        env:
          CATALOGUE_SIGNING_KEY: ${{ secrets.CATALOGUE_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CATALOGUE_SIGNING_KEY:-}" ]; then
            echo "No CATALOGUE_SIGNING_KEY; publishing without a catalogue."
            exit 0
          fi
          umask 077
          printf '%s' "$CATALOGUE_SIGNING_KEY" > "$RUNNER_TEMP/cat.key"
          mkdir -p site/catalogue
          cargo run --locked -q -p unv-cli -- catalogue sign catalogue/providers.json \
            --key-file "$RUNNER_TEMP/cat.key" -o site/catalogue/catalogue.json
          rm -f "$RUNNER_TEMP/cat.key"

      # Run by hand once before wiring in (roadmap W1): scripts/check-site.mjs
      # fails on horizontal scroll, a missing or second h1, an unnamed link, an
      # image without alt or size, a missing skip link or focus ring, a console
      # error or a 404, at 1440 and 390 px.
      - name: Browser checks on the assembled site
        run: |
          npx playwright install --with-deps chromium
          node scripts/check-site.mjs site

      # Offline: every internal link and fragment on the product pages resolves
      # inside ./site (the generated guide and references have their own tools and
      # carry links this check cannot judge). External
      # links are not gated, because a third party being down must not block a
      # docs deploy; tools/ and the handoff list them for a manual pass.
      - name: Check internal links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline --no-progress --include-fragments --index-files index.html
            --root-dir ${{ github.workspace }}/site
            --exclude-path '/(docs|reference/ts|reference/rust)/'
            './site/**/*.html'
          fail: true

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
