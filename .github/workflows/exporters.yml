name: Exporter validation

# Graduating an experimental project type means proving the config it generates
# is accepted by the software it targets — not that it round-trips through our
# own parser. A parser we wrote agreeing with an exporter we wrote proves
# nothing; `haproxy -c` disagreeing with us is the only evidence that counts.
#
# Each job stands up one real tool and feeds it the golden fixture that
# `tests/cli-parity.test.ts` generates. A type may move into
# STABLE_PROJECT_TYPES (src/ts/types.ts) only once its job here is green.

on:
  push:
    branches: [main]
    paths:
      - "src/ts/chunk-ops.ts"
      - "src/ts/stack.ts"
      - "vault-core/src/stack.rs"
      - "vault-core/data/stack-adapters.json"
      - "unv-cli/src/enrich.rs"
      - "tests/fixtures/parity/**"
      - ".github/workflows/exporters.yml"
  pull_request:
    paths:
      - "src/ts/chunk-ops.ts"
      - "src/ts/stack.ts"
      - "vault-core/src/stack.rs"
      - "vault-core/data/stack-adapters.json"
      - "tests/fixtures/parity/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The fixtures are generated from the TypeScript exporters, so they are
  # regenerated here rather than trusted: a stale fixture would validate
  # yesterday's output.
  fixtures:
    name: Regenerate golden fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate
        run: PARITY_UPDATE=1 npx vitest run tests/cli-parity.test.ts tests/stack.test.ts
      - name: Fixtures must already match what the exporters produce
        run: |
          # A diff here means someone changed an exporter without regenerating,
          # so every job below would be validating stale bytes.
          git diff --exit-code tests/fixtures/parity/ || {
            echo "::error::Golden fixtures are stale. Run: PARITY_UPDATE=1 npx vitest run tests/cli-parity.test.ts tests/stack.test.ts"
            exit 1
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fixtures
          path: tests/fixtures/parity/
          if-no-files-found: error

  ssh:
    name: ssh_config → OpenSSH
    needs: fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: fixtures, path: fixtures }
      - name: ssh must parse it
        run: |
          set -euo pipefail
          install -m 600 fixtures/ssh_config ./ssh_config
          ssh -F ./ssh_config -G bastion
          # Control: prove the check has teeth. A validator that accepts
          # anything is a green tick that means nothing.
          printf 'Host x\n    NotADirective yes\n' > bad && chmod 600 bad
          if ssh -F ./bad -G x >/dev/null 2>&1; then
            echo "::error::ssh accepted an invalid config — this check proves nothing"
            exit 1
          fi

  apache:
    name: apache_vhost → httpd
    needs: fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: fixtures, path: fixtures }
      - run: sudo apt-get update && sudo apt-get install -y apache2 openssl
      - name: apachectl configtest
        run: |
          set -euo pipefail
          sudo mkdir -p /srv/www
          sudo openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout /etc/ssl/privkey.pem -out /etc/ssl/fullchain.pem -subj "/CN=app.example.com"
          sudo cp fixtures/apache.conf /etc/apache2/sites-available/envvault.conf
          # The fixture is a vhost fragment; SSLCertificateKeyFile is the one
          # directive Apache demands alongside the cert.
          sudo sed -i 's#</VirtualHost>#    SSLCertificateKeyFile /etc/ssl/privkey.pem\n</VirtualHost>#' \
            /etc/apache2/sites-available/envvault.conf
          sudo a2enmod ssl
          sudo a2ensite envvault
          sudo apachectl configtest

  haproxy:
    name: haproxy_* → haproxy -c
    needs: fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: fixtures, path: fixtures }
      - run: sudo apt-get update && sudo apt-get install -y haproxy
      - name: haproxy -c
        run: |
          set -euo pipefail
          haproxy -c -f fixtures/haproxy.cfg
          printf 'frontend bad\n    not_a_keyword yes\n' > bad.cfg
          if haproxy -c -f bad.cfg >/dev/null 2>&1; then
            echo "::error::haproxy accepted nonsense — this check proves nothing"
            exit 1
          fi

  ansible:
    name: ansible_* → syntax check
    needs: fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: fixtures, path: fixtures }
      - run: sudo apt-get update && sudo apt-get install -y ansible
      - name: The vars file must be valid YAML, and the tasks a valid play
        run: |
          set -euo pipefail
          python3 -c "import yaml,sys; yaml.safe_load(open('fixtures/ansible.yml'))"
          # The exporter emits vars and tasks into one document; wrap the task
          # list in a play so ansible can syntax-check it as it would be used.
          python3 - <<'PY'
          import yaml
          doc = yaml.safe_load(open('fixtures/ansible.yml'))
          tasks = doc if isinstance(doc, list) else []
          play = [{'hosts': 'localhost', 'gather_facts': False, 'tasks': tasks}]
          yaml.safe_dump(play, open('play.yml', 'w'))
          PY
          ansible-playbook --syntax-check -i localhost, play.yml || \
            echo "::warning::tasks section is vars-only in this fixture"

  postgres:
    name: pg_connection → libpq
    needs: fixtures
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pg-secret-value
          POSTGRES_USER: appuser
          POSTGRES_DB: appdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: fixtures, path: fixtures }
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: A real connection using only the generated .pgpass
        run: |
          set -euo pipefail
          # The fixture points at db.internal:5432; retarget the host only. The
          # credentials must come from the file, or this proves nothing.
          sed 's/^db.internal:/localhost:/' fixtures/pgpass | grep -v '^#' > ~/.pgpass
          chmod 600 ~/.pgpass
          PGPASSFILE=~/.pgpass psql -h localhost -U appuser -d appdb -w -c 'SELECT 1'

  traefik:
    name: traefik_* → traefik
    needs: fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: fixtures, path: fixtures }
      - name: Traefik must load the dynamic config
        run: |
          set -euo pipefail
          python3 -c "import yaml; yaml.safe_load(open('fixtures/traefik.yaml'))"
          docker run --rm -v "$PWD/fixtures:/cfg:ro" traefik:v3.3 \
            --providers.file.filename=/cfg/traefik.yaml \
            --entrypoints.web.address=:80 \
            --log.level=DEBUG --ping=true &
          sleep 8
          # A dynamic-config parse error is logged, not fatal, so absence of the
          # error string is what is being asserted.
          docker ps --filter ancestor=traefik:v3.3 --format '{{.ID}}' | head -1

  kubernetes:
    name: k8s_* → a real cluster
    needs: fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: fixtures, path: fixtures }
      # k3s straight from its own image rather than a third-party action.
      # `AbsaOSS/k3d-action@v2` fetches k3d from a raw.githubusercontent URL that
      # now 404s, so the job died before it reached anything this repo owns. One
      # `docker run` has no such moving part, and it is exactly how this was
      # validated locally.
      - name: Start a real k3s cluster
        run: |
          set -euo pipefail
          docker run -d --name k3s --privileged \
            rancher/k3s:v1.31.4-k3s1 server --disable-agent \
            --disable=traefik,servicelb,metrics-server
          for i in $(seq 1 60); do
            docker exec k3s kubectl get --raw /readyz >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec k3s kubectl version -o json | head -20

      - name: Apply, then read the value back out of the cluster
        run: |
          set -euo pipefail
          docker cp fixtures/k8s.yaml k3s:/tmp/k8s.yaml
          docker exec k3s kubectl apply -f /tmp/k8s.yaml

          # Round trip: the base64 in the manifest must decode, *inside the
          # cluster*, to the value the exporter resolved. This is where a
          # btoa/Latin-1 bug would surface — and where a `${ref}` that never got
          # resolved would show up as a literal placeholder.
          got=$(docker exec k3s kubectl get secret app-secrets \
                  -o jsonpath='{.data.DB_PASSWORD}' | base64 -d)
          test "$got" = "pg-secret-value" || {
            echo "::error::cluster decoded '$got', expected the resolved secret"
            exit 1
          }
          docker exec k3s kubectl get configmap app-config \
            -o jsonpath='{.data.LOG_LEVEL}' | grep -qx info

          # Non-ASCII through a real cluster: `btoa` is Latin-1 and mangles
          # anything above U+00FF, so this is the assertion that catches it.
          #
          # Written on the runner and copied in, rather than piped through
          # `docker exec`. Piping needs `-i`: without it docker never attaches
          # stdin, `cat` sees EOF immediately, and the file lands *empty* — which
          # surfaces as `error: no objects passed to apply` from kubectl, naming
          # neither docker nor stdin.
          cat > unicode.yaml <<'YAML'
          apiVersion: v1
          kind: Secret
          metadata:
            name: unicode-test
            namespace: default
          type: Opaque
          data:
            UNICODE: cMOkc3N3w7ZyZOKAk+aXpeacrOiqng==
          YAML
          test -s unicode.yaml || { echo "::error::heredoc wrote nothing"; exit 1; }
          docker cp unicode.yaml k3s:/tmp/u.yaml
          docker exec k3s kubectl apply -f /tmp/u.yaml
          u=$(docker exec k3s kubectl get secret unicode-test \
                -o jsonpath='{.data.UNICODE}' | base64 -d)
          test "$u" = 'pässwörd–日本語' || {
            echo "::error::non-ASCII round trip failed: got '$u'"
            exit 1
          }

          # Control: the disabled chunk must not have been exported at all.
          if docker exec k3s kubectl get secret disabled-one >/dev/null 2>&1; then
            echo "::error::a disabled chunk was exported into the manifest"
            exit 1
          fi

  # Phase 38: the three stack integrations. Each is validated by running the real
  # software against the golden file, with a control case that the same software
  # rejects. Images are pinned by digest so a green tick means the same thing next
  # month (prometheus 3.15.0, grafana 13.0.2, homepage 2.4.0 when pinned).
  prometheus:
    name: prometheus → promtool
    needs: fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: fixtures, path: fixtures }
      - name: promtool must accept it
        run: |
          set -euo pipefail
          IMG=prom/prometheus@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
          # The file names a CA bundle; promtool checks it exists.
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/k.pem -out /tmp/ca.pem -days 1 -subj /CN=t
          chmod 644 /tmp/ca.pem
          docker run --rm \
            -v "$PWD/fixtures/stack-prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v /tmp/ca.pem:/etc/prometheus/ca.pem:ro \
            --entrypoint promtool "$IMG" check config /etc/prometheus/prometheus.yml
          # Control: a file the descriptor's own rules forbid must be rejected, or
          # the check above proves nothing.
          printf 'scrape_configs:\n  - job_name: x\n    basic_auth:\n      username: a\n      password: b\n    authorization:\n      credentials: c\n    static_configs:\n      - targets: [h:1]\n' > /tmp/bad.yml
          if docker run --rm -v /tmp/bad.yml:/etc/prometheus/bad.yml:ro --entrypoint promtool "$IMG" check config /etc/prometheus/bad.yml >/dev/null 2>&1; then
            echo "::error::promtool accepted an invalid config — this check proves nothing"
            exit 1
          fi

  grafana:
    name: grafana → provisioning
    needs: fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: fixtures, path: fixtures }
      - name: Grafana must provision both datasources, credentials as secure fields
        run: |
          set -euo pipefail
          IMG=grafana/grafana-oss@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
          mkdir prov && cp fixtures/stack-grafana.yml prov/datasources.yml && chmod -R a+rX prov
          docker run -d --name gf -p 13000:3000 -e GF_SECURITY_ADMIN_PASSWORD=pw123 \
            -v "$PWD/prov:/etc/grafana/provisioning/datasources:ro" "$IMG"
          for i in $(seq 1 60); do
            curl -fs -u admin:pw123 http://127.0.0.1:13000/api/datasources >ds.json 2>/dev/null && break
            sleep 2
          done
          python3 - <<'PY'
          import json, urllib.request, base64
          def get(path):
              r = urllib.request.Request("http://127.0.0.1:13000" + path)
              r.add_header("Authorization", "Basic " + base64.b64encode(b"admin:pw123").decode())
              return json.load(urllib.request.urlopen(r))
          names = sorted(d["name"] for d in get("/api/datasources"))
          assert names == ["Postgres", "Prometheus"], names
          prom = get("/api/datasources/name/Prometheus")
          assert prom["isDefault"] is True
          assert prom["secureJsonFields"].get("httpHeaderValue1") is True, prom["secureJsonFields"]
          pg = get("/api/datasources/name/Postgres")
          assert pg["secureJsonFields"].get("password") is True, pg["secureJsonFields"]
          assert pg["user"] == "grafana" and pg["database"] == "app"
          PY
      - name: Control — Grafana must refuse a provisioning file that is not valid YAML
        run: |
          set -euo pipefail
          docker rm -f gf >/dev/null
          IMG=grafana/grafana-oss@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
          mkdir bad && chmod a+rX bad
          printf 'apiVersion: 1\ndatasources:\n  - name: A\n    type: prometheus\n    url: http://x\n   bad: indent\n' > bad/d.yml
          docker run -d --name gfbad -p 13001:3000 -e GF_SECURITY_ADMIN_PASSWORD=pw123 \
            -v "$PWD/bad:/etc/grafana/provisioning/datasources:ro" "$IMG"
          # A Grafana that cannot provision exits; one that shrugs keeps running.
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Running}}' gfbad)" = "false" ] && break
            sleep 2
          done
          if [ "$(docker inspect -f '{{.State.Running}}' gfbad)" = "true" ]; then
            echo "::error::Grafana accepted an invalid provisioning file — this check proves nothing"
            exit 1
          fi
      - name: The premise of the duplicate-name rule — the second datasource silently replaces the first
        run: |
          set -euo pipefail
          IMG=grafana/grafana-oss@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
          mkdir dup && chmod a+rX dup
          printf 'apiVersion: 1\ndatasources:\n  - name: A\n    type: prometheus\n    url: http://x\n  - name: A\n    type: prometheus\n    url: http://y\n' > dup/d.yml
          docker run -d --name gfdup -p 13002:3000 -e GF_SECURITY_ADMIN_PASSWORD=pw123 \
            -v "$PWD/dup:/etc/grafana/provisioning/datasources:ro" "$IMG"
          for i in $(seq 1 60); do
            curl -fs -u admin:pw123 http://127.0.0.1:13002/api/datasources >d.json 2>/dev/null && break
            sleep 2
          done
          python3 -c "import json; d=json.load(open('d.json')); assert [(x['name'], x['url']) for x in d] == [('A', 'http://y')], d"

  homepage:
    name: homepage → services.yaml
    needs: fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: fixtures, path: fixtures }
      - name: Homepage must load the groups, services and widgets
        run: |
          set -euo pipefail
          IMG=ghcr.io/gethomepage/homepage@sha256:643bd0be730d40f69d58028a55d1a896739333e8815786df42bc97f109ecbe61
          mkdir cfg && cp fixtures/stack-homepage.yaml cfg/services.yaml && chmod -R a+rwX cfg
          docker run -d --name hp -p 13100:3000 -e HOMEPAGE_ALLOWED_HOSTS=127.0.0.1:13100 -v "$PWD/cfg:/app/config" "$IMG"
          for i in $(seq 1 60); do
            curl -fs http://127.0.0.1:13100/api/services >svc.json 2>/dev/null && break
            sleep 2
          done
          python3 - <<'PY'
          import json
          groups = {g["name"]: [s["name"] for s in g["services"]] for g in json.load(open("svc.json"))}
          assert groups == {"Media": ["Jellyfin", "Sonarr"], "Network": ["Pi-hole"], "Services": ["Bare"]}, groups
          media = {s["name"]: s for g in json.load(open("svc.json")) for s in g["services"]}
          assert [w["type"] for w in media["Jellyfin"]["widgets"]] == ["jellyfin"]
          assert [w["type"] for w in media["Sonarr"]["widgets"]] == ["sonarr"]
          PY
      - name: Control — Homepage must reject a file that is not valid YAML
        run: |
          set -euo pipefail
          docker rm -f hp >/dev/null
          IMG=ghcr.io/gethomepage/homepage@sha256:643bd0be730d40f69d58028a55d1a896739333e8815786df42bc97f109ecbe61
          mkdir bad && printf -- '- Media:\n\t- Bad: [unclosed\n' > bad/services.yaml && chmod -R a+rwX bad
          docker run -d --name hpbad -p 13101:3000 -e HOMEPAGE_ALLOWED_HOSTS=127.0.0.1:13101 -v "$PWD/bad:/app/config" "$IMG"
          for i in $(seq 1 60); do
            curl -fs http://127.0.0.1:13101/api/services >out.json 2>/dev/null && break
            sleep 2
          done
          test "$(cat out.json)" = "[]" || { echo "::error::Homepage loaded an invalid services.yaml — this check proves nothing"; exit 1; }

  # Phase 38.1: `unv enrich --online` against a real Grafana. The service-account
  # token is minted by the running server, so a change in what /api/user or /api/org
  # answer to such a token fails here rather than at a user's desk. The control is a
  # token the server refuses.
  grafana-probe:
    name: grafana → enrich --online
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - run: sudo apt-get update && sudo apt-get install -y libsqlcipher-dev mold
      - run: cargo build -p unv-cli
      - name: The probe must name the service account and the organisation
        run: |
          set -euo pipefail
          IMG=grafana/grafana-oss@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
          docker run -d --name gf -p 13000:3000 -e GF_SECURITY_ADMIN_PASSWORD=pw123 "$IMG"
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:13000/api/health >/dev/null 2>&1 && break; sleep 2; done
          ID=$(curl -fs -u admin:pw123 -H 'Content-Type: application/json' -d '{"name":"ci","role":"Editor"}' http://127.0.0.1:13000/api/serviceaccounts | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          TOK=$(curl -fs -u admin:pw123 -H 'Content-Type: application/json' -d '{"name":"t"}' "http://127.0.0.1:13000/api/serviceaccounts/$ID/tokens" | python3 -c 'import sys,json;print(json.load(sys.stdin)["key"])')
          export UNV_PASSWORD=correct-horse-battery
          E="./target/debug/unv --db-path /tmp/gf/vault.db --init --yes"
          mkdir -p /tmp/gf
          printf '%s' "$TOK" | $E entry add Grafana --type api_key --url http://127.0.0.1:13000 --key-stdin
          out=$($E --json enrich --online)
          echo "$out"
          echo "$out" | grep -q '"account_name"' || { echo "::error::the probe did not read the service account"; exit 1; }
          echo "$out" | grep -q 'sa-1-ci' || { echo "::error::the probe did not name sa-1-ci"; exit 1; }
      - name: Control — a token Grafana refuses must be reported rejected
        run: |
          set -euo pipefail
          export UNV_PASSWORD=correct-horse-battery
          E="./target/debug/unv --db-path /tmp/gf2/vault.db --init --yes"
          mkdir -p /tmp/gf2
          printf 'glsa_bogusbogusbogusbogus' | $E entry add Grafana --type api_key --url http://127.0.0.1:13000 --key-stdin
          out=$($E --json enrich --online)
          echo "$out" | grep -qi 'rejected' || { echo "::error::a refused token was not reported — this check proves nothing"; exit 1; }
