[workspace]
members  = ["src-tauri", "vault-core", "envv-server", "envv-cli"]
resolver = "2"

# Warnings are errors — but only for the four crates in this workspace.
#
# This lives here rather than in CI's RUSTFLAGS because RUSTFLAGS applies to
# every unit cargo compiles, dependencies included: a warning inside
# `windows-sys` or `openssl-src` would fail the build with nothing in this
# repository to fix. `[lints]` is inherited only by packages that opt in with
# `lints.workspace = true`, so third-party code is free to warn.
#
# It also means the rule is the same locally as in CI, instead of a flag one
# environment sets and the other does not.
[workspace.lints.rust]
warnings = "deny"

# Clippy. Only the groups that describe defects are denied; `pedantic` and
# `nursery` are not enabled wholesale because most of what they report here is
# a style preference, and three hundred style warnings hide the one real bug.
#
# Note the interaction with `warnings = "deny"` above: under `cargo clippy` the
# `warnings` group covers clippy's own lints too, so anything set to "warn" here
# is an error in a clippy run and merely absent from a `cargo check` run. That
# is intended — `cargo check` stays fast, `cargo clippy` is the gate.
[workspace.lints.clippy]
# Defect groups.
correctness = { level = "deny", priority = -1 }
suspicious  = { level = "deny", priority = -1 }
perf        = { level = "warn", priority = -1 }
complexity  = { level = "warn", priority = -1 }
style       = { level = "warn", priority = -1 }

# Hand-picked, and every entry here is either `deny` or `allow` on purpose.
#
# `warn` is not a useful level in this workspace: `warnings = "deny"` above
# covers clippy's lints too when clippy is the driver, so anything set to "warn"
# is an error in practice. Writing "warn" would only disguise that.
#
# The allows below are decisions, not oversights — each names the code it is
# there for.

# A leaked key is the failure that matters here, so this one is a hard denial:
# `mem::forget` on anything holding key material skips the `Drop` that zeroizes
# it, and the bytes stay in the process image until the allocator reuses them.
mem_forget = "deny"

# `dbg!` prints to stderr and survives review far too easily. In a program whose
# variables are secrets, a stray one is a disclosure.
dbg_macro = "deny"

# Printing IS the CLI's job — `envv describe`, `envv get`, every exporter.
print_stdout = "allow"

# Used deliberately and pervasively; converting the codebase to fallible access
# everywhere is a much larger change than adding a linter, and would be a
# behaviour change rather than a cleanup.
unwrap_used      = "allow"
indexing_slicing = "allow"

# `uri.len() / 1024` in a "97 KB / 96 KB limit" message. The truncation is the
# point — nobody wants three decimal places in an error string.
integer_division = "allow"

# `alphabet.len() as u32` in the secret generator, and byte-count casts in the
# backup format. The values are bounded by construction (a 64-character
# alphabet, a length already validated against a smaller ceiling), so the cast
# cannot truncate anything that reaches it.
cast_possible_truncation = "allow"

# `Result<(), axum::response::Response>` in envv-server. The Err variant is an
# axum Response because that is what the handler must return; boxing it to save
# 128 bytes on a path that runs once per rejected request trades clarity for
# nothing measurable.
result_large_err = "allow"

# `cmd_list` takes eight filter flags because the command has eight filter
# flags. Bundling them into a struct moves the argument list rather than
# shortening it.
too_many_arguments = "allow"

# A `todo!()` or `unimplemented!()` reaching a release build is a panic in a
# secrets manager. Deny outright — a placeholder belongs behind a feature flag
# or not in the tree.
todo          = "deny"
unimplemented = "deny"

[profile.release]
panic         = "abort"
codegen-units = 1
lto           = true
strip         = true
opt-level     = "s"

[profile.dev-fast]
inherits      = "dev"
opt-level     = 1
codegen-units = 32
lto           = false
incremental   = true

[profile.release-fast]
inherits      = "release"
opt-level     = 2
codegen-units = 16
lto           = false
incremental   = true
strip         = false
