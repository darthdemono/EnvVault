services:
  envv-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: envv-server:0.6.0
    container_name: envv-server
    ports:
      - "8743:8743"
    volumes:
      - ./envv:/data # bind-mount: data lives next to docker-compose.yml, easy to back up / move
    environment:
      # Set ENVV_PASSWORD in a .env file to auto-unlock on startup.
      # Leave unset to require manual POST /api/unlock instead.
      #
      # The same .env drives the CLI: `envv --env-file .env enrich --online`
      # reads the password from here rather than keeping a second copy.
      - ENVV_PASSWORD=${ENVV_PASSWORD:-}
      # Raise if you actually serve concurrent clients; 2 is right for a vault.
      - ENVV_WORKER_THREADS=${ENVV_WORKER_THREADS:-2}
      - MALLOC_ARENA_MAX=2
      # Structured logging. `info` is the built-in default; set `ENVV_LOG=debug`
      # to get one line per request with its id, or `ENVV_LOG_FORMAT=json` to
      # ship the log somewhere that parses it.
      - ENVV_LOG=${ENVV_LOG:-info}
      - ENVV_LOG_FORMAT=${ENVV_LOG_FORMAT:-}
    restart: unless-stopped

    # A hard ceiling, not a target. Steady state is a few MB; the spikes are
    # Argon2id, which is configured at m=65536 — 64 MB per unlock, by design,
    # because that cost is what makes the master password expensive to guess.
    # 256 MB leaves room for two concurrent unlocks without the OOM killer
    # turning a login into a container restart.
    mem_limit: 256m
    memswap_limit: 256m
    # Tiny stack of its own; the default 64 MB /dev/shm is unused here.
    shm_size: 16m

    healthcheck:
      # Ask the application whether it works, not whether it is bound.
      #
      # This used to open the TCP port with bash's /dev/tcp, which is already
      # better than `--version` — but a wedged process still accepts a
      # connection. `GET /api/health` answers 503 when the server is listening
      # and cannot reach its own vault, which is the state `restart:
      # unless-stopped` above exists to recover from and the only state the old
      # check could not see. The endpoint reports no counts, so exposing it to a
      # monitor discloses nothing about the vault's contents.
      #
      # Still no curl in the image: bash writes the request and greps the status
      # line. `-s` matches a 200 only, so a 503 fails the check.
      test:
        [
          "CMD-SHELL",
          "timeout 3 bash -c 'exec 3<>/dev/tcp/127.0.0.1/8743; printf \"GET /api/health HTTP/1.0\r\n\r\n\" >&3; head -n1 <&3 | grep -q \" 200 \"' || exit 1",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    # Pass --port here to override default 8743
    # command: ["--port", "9000"]
