[package]
name    = "envv-cli"
version = "0.20.0"
edition = "2021"
license = "MIT"

[lib]
name = "envv_cli"
path = "src/lib.rs"

[[bin]]
name = "envv"
path = "src/main.rs"

[dependencies]
vault-core = { path = "../vault-core", features = ["tls", "telemetry"] }
tracing    = "0.1"
clap       = { version = "4", features = ["derive", "env"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
rpassword  = "7"
dirs       = "5"
# Blocking HTTP client for remote-mode operations
# default-features = false is load-bearing: the default pulls native-tls, which
# would give the CLI a different TLS stack from the desktop app and from the
# shared verifier in vault_core::tls.
reqwest       = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
clap_complete = "4"
notify        = "6"
uuid          = { version = "1", features = ["v4"] }
# Encrypted backup envelope (.vaultbak) — must match the WebCrypto format the
# desktop app writes: PBKDF2-SHA256 → AES-256-GCM.
aes-gcm    = "0.10"
pbkdf2     = { version = "0.12", default-features = false, features = ["hmac"] }
sha2       = "0.10"
hmac       = "0.12"
base64     = "0.22"
rand       = "=0.8.5"
time       = { version = "=0.3.37", features = ["parsing"] }

# Deny warnings, per [workspace.lints.rust] at the repo root.
[lints]
workspace = true
