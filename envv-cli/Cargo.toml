[package]
name    = "envv-cli"
version = "0.6.0"
edition = "2021"

[[bin]]
name = "envv"
path = "src/main.rs"

[dependencies]
vault-core = { path = "../vault-core" }
clap       = { version = "4", features = ["derive", "env"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
rpassword  = "7"
dirs       = "5"
# Blocking HTTP client for remote-mode operations
reqwest       = { version = "0.12", features = ["json", "blocking"] }
clap_complete = "4"
notify        = "6"
