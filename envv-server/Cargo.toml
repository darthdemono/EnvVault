[package]
name    = "envv-server"
version = "0.8.0"
edition = "2021"
license = "MIT"

# Library first: the desktop app embeds this router for "Open to LAN", so the
# binary is only a CLI wrapper around it.
[lib]
name = "envv_server"
path = "src/lib.rs"

[[bin]]
name = "envv-server"
path = "src/main.rs"

[dependencies]
vault-core   = { path = "../vault-core" }
axum         = "0.8"
axum-server  = { version = "0.8", features = ["tls-rustls"] }
tokio        = { version = "1", features = ["full"] }
tower-http   = { version = "0.6", features = ["cors"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
uuid         = { version = "1", features = ["v4"] }
zeroize      = "=1.8.1"
clap         = { version = "4", features = ["derive"] }
dirs         = "5"
utoipa       = { version = "5", features = ["axum_extras"] }
rcgen        = "=0.13.2"
rustls-pemfile = "2"
# Direct dependency purely so main() can install a process-level CryptoProvider.
# Needed because the workspace now enables two providers on one rustls: axum-server
# pulls `ring`, and vault-core's `tls` feature pulls `aws_lc_rs`. Cargo unifies
# features across a build, rustls then refuses to guess, and the server panics on
# startup. Choosing explicitly is the fix; leaving it to the default is a bug that
# only appears once some *other* crate in the workspace grows a TLS dependency.
rustls         = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
sha2         = "0.10"
hex          = "=0.4.3"
time         = "=0.3.37"

# Deny warnings, per [workspace.lints.rust] at the repo root.
[lints]
workspace = true
