[package]
name    = "api-vault"
version = "0.2.0"
edition = "2021"

[lib]
name       = "api_vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri             = { version = "2", features = [] }   # rustls-tls removed (was invalid)
tauri-plugin-shell = "2"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"

# Phase 2 — encrypted storage
rusqlite = { version = "0.31", features = ["bundled-sqlcipher"] }
argon2   = "0.5"
rand     = "0.8"
hex      = "0.4"
zeroize  = { version = "1", features = ["zeroize_derive"] }

[profile.release]
panic         = "abort"
codegen-units = 1
lto           = true
strip         = true
opt-level     = "s"
