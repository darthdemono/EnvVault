[package]
name    = "envvault"
version = "0.6.0"
edition = "2021"
license = "MIT"

[lib]
name       = "env_vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri                        = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell           = "2"
tauri-plugin-global-shortcut = "2"
# Window size/position persistence. Saved to <app_config_dir>/.window-state.json
# by the plugin itself — no vault data involved, so it is deliberately outside
# SQLCipher and survives a vault reset.
tauri-plugin-window-state    = "2"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
vault-core        = { path = "../vault-core" }
# "Open to LAN": the desktop hosts the same axum router in-process against the
# vault it already has open, rather than shelling out to a second process with a
# second database.
envv-server       = { path = "../envv-server" }
tokio             = { version = "1", features = ["rt", "sync", "time"] }
zeroize           = { version = "=1.8.1", features = ["zeroize_derive"] }
# HTTP proxy for remote vault with TLS cert pinning (Phase 6)
reqwest           = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rustls            = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-pki-types  = "1"
sha2              = "0.10"
hex               = "=0.4.3"

# Deny warnings, per [workspace.lints.rust] at the repo root.
[lints]
workspace = true
