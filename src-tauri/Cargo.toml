[package]
name    = "unenverse"
version = "0.42.4"
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
name       = "unenverse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri                        = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell           = "2"
tauri-plugin-global-shortcut = "2"
# Window size/position persistence. Saved to <app_config_dir>/.window-state.json
# by the plugin itself — no vault data involved, so it is deliberately outside
# SQLCipher and survives a vault reset.
tauri-plugin-window-state    = "2"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
vault-core        = { path = "../vault-core", features = ["tls", "telemetry"] }
# `enrich`'s planner (Phase 33.1): the app calls the same `plan_entry` the CLI does,
# so what a Preview shows is what `unv enrich` would propose.
unv-cli          = { path = "../unv-cli" }
tracing           = "0.1"
# "Open to LAN": the desktop hosts the same axum router in-process against the
# vault it already has open, rather than shelling out to a second process with a
# second database.
unv-server       = { path = "../unv-server" }
tokio             = { version = "1", features = ["rt", "sync", "time"] }
zeroize           = { version = "=1.8.1", features = ["zeroize_derive"] }
# HTTP proxy for remote vault with TLS cert pinning (Phase 6)
reqwest           = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rustls            = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-pki-types  = "1"
sha2              = "0.10"
hex               = "=0.4.3"
# A3: where an export actually lands on disk (write_export_file), rather than
# a WebKitGTK `<a download>` click the webview has no handler for.
dirs              = "5"

# Caps Lock from GDK's keymap (A4). Linux only: glib-sys needs pkg-config and the
# GTK headers, which a Windows build has neither of, and the Windows path of
# `caps_lock_state` calls user32 directly instead.
[target.'cfg(target_os = "linux")'.dependencies]
gtk               = { version = "0.18", default-features = false }

# Deny warnings, per [workspace.lints.rust] at the repo root.
[lints]
workspace = true
