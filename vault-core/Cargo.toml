[package]
name    = "vault-core"
version = "0.4.0"
edition = "2021"

[dependencies]
rusqlite = { version = "=0.31.0", features = ["sqlcipher"] }
argon2   = "=0.5.3"
rand     = "=0.8.5"
hex      = "=0.4.3"
zeroize  = { version = "=1.8.1", features = ["zeroize_derive"] }
rcgen    = "=0.13.2"
ssh-key  = { version = "=0.6.7", features = ["ed25519", "crypto"] }
time     = "=0.3.37"
sha2     = "0.10"
serde    = { version = "1", features = ["derive"] }
serde_json = "1"
