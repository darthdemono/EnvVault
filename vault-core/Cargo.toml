[package]
name    = "vault-core"
version = "0.42.5"
edition = "2021"
publish = false
license = "Apache-2.0"

[features]
default = []
# Compile SQLCipher and OpenSSL into the binary instead of linking the system's.
#
# Use it for any artefact that has to run on a machine other than the one that
# built it: an AppImage linked against Fedora's libsqlcipher0 will not start on a
# Debian box shipping a different soname, and "works on my distro" is the whole
# problem a portable bundle exists to solve.
bundled = ["rusqlite/bundled-sqlcipher-vendored-openssl"]
# The shared TLS client policy (`tls.rs`). Off by default so `unv-server`, which
# only ever serves TLS, does not link a TLS *client* stack it never calls. The
# desktop app and the CLI both turn it on — and they must both build from it, or
# the split that this module exists to close reopens.
tls = ["dep:rustls", "dep:rustls-pki-types", "dep:webpki-roots"]
# Structured logging (`telemetry.rs`). Off by default so a library consumer does
# not inherit a subscriber it never asked for; all three binaries turn it on.
# It is one feature rather than three copies of the same subscriber setup
# because the stderr-only rule has to hold identically in every binary — the
# CLI's JSON envelope on stdout is what breaks the moment one of them differs.
telemetry = ["dep:tracing", "dep:tracing-subscriber"]

[dependencies]
# Unix links the system SQLCipher by default: it builds in seconds instead of
# minutes, which matters far more during development than portability does.
rusqlite   = { version = "=0.40.2", features = ["sqlcipher"] }
argon2     = "=0.5.3"
rand       = "=0.8.6"
hex        = "=0.4.3"
zeroize    = { version = "=1.8.1", features = ["zeroize_derive"] }
rcgen      = "=0.13.2"
ssh-key    = { version = "=0.6.7", features = ["ed25519", "crypto"] }
time       = { version = "0.3.55", features = ["parsing"] }
sha2       = "0.10"
ed25519-dalek = "2"
# HKDF is implemented over this rather than pulled in as `hkdf`: the extract and
# expand steps are ten lines, and `entropy.rs` needs them to be readable — the
# mixing rule is the security property of that module.
hmac       = "0.12"
# RFC 6238 pins HMAC-SHA1 for TOTP interoperability. Every authenticator app
# assumes it; the newer variants exist in the spec and are read by almost
# nothing, so using one would produce codes that are correct and rejected.
sha1       = "0.10"
# Google Authenticator's migration payload is base64 inside a URI. The CLI
# already depended on this for embedded icons; it lives here now because the
# desktop app reads the same payload through `totp_import`.
base64     = "0.22"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "=0.8.2"
# Locating the per-user state directory for pools.json ($XDG_STATE_HOME on Unix,
# %LOCALAPPDATA% on Windows). The CLI already depended on this; the path lives
# here now because the desktop app reads the same file.
dirs       = "5"

# TLS client policy, feature-gated behind `tls`. Versions match src-tauri's, which
# is not a coincidence: two rustls majors in one dependency graph means two
# CryptoProviders, and the custom verifier only satisfies the trait of one.
rustls           = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"], optional = true }
rustls-pki-types = { version = "1", optional = true }
webpki-roots     = { version = "0.26", optional = true }

# Structured logging, feature-gated behind `telemetry`.
tracing            = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "json", "ansi", "std"], optional = true }

# Windows has no system SQLCipher to link against, so it always vendors —
# otherwise the first thing a Windows contributor meets is a linker error about
# a library their platform does not package. Cargo unions target features, so
# this simply adds bundling on top of the `sqlcipher` feature above.
[target.'cfg(windows)'.dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }

# Deny warnings, per [workspace.lints.rust] at the repo root.
[lints]
workspace = true
